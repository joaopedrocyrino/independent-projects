name: Build and deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: projects-production-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Scan public Git history for secrets
        run: docker run --rm --network none -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: dotnet restore Projects.slnx --locked-mode
      - run: dotnet build Projects.slnx -c Release --no-restore
      - run: dotnet test --solution Projects.slnx -c Release --no-build --no-restore
      - run: node --test scripts/deployment.test.mjs
      - name: Lint deployment scripts
        run: docker run --rm --network none -v "$PWD:/work:ro" -w /work koalaman/shellcheck:v0.11.0 scripts/deploy-production.sh scripts/deploy-remote.sh
      - run: npm run build --prefix frontend
      - name: Build the release image
        run: |
          printf 'APP_IMAGE=ghcr.io/%s:%s\n' "${GITHUB_REPOSITORY,,}" "$GITHUB_SHA" >> "$GITHUB_ENV"
          docker build --build-arg SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA" .
      - name: Test the built monolith against PostgreSQL
        run: |
          python3 scripts/init-env.py
          docker compose -p projects-ci up -d --wait postgres
          docker compose -p projects-ci --profile tools run --rm migrate
          docker compose -p projects-ci --profile app up -d --no-build app
          npm run test:integration
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Publish the tested image
        id: publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$APP_IMAGE"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$APP_IMAGE")
          [[ "$image" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - if: always()
        run: docker compose -p projects-ci --profile app --profile tools down --volumes
  deploy:
    name: Deploy to shared droplet
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://projects.joaocyrino.com
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      CADDY_CONTAINER: ${{ vars.CADDY_CONTAINER }}
      APP_HOSTNAME: projects.joaocyrino.com
      APP_IMAGE: ${{ needs.release.outputs.image }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/deploy-production.sh
